{% extends "base.html" %}
{% set editing = product and product.id %}
{% block title %}관리자 · {{ '상품 수정' if editing else '상품 등록' }}{% endblock %}

{% block content %}
<section class="container section">
  <div class="page-head">
    <h1>{{ '상품 수정' if editing else '상품 등록' }}</h1>
    <a class="btn btn-outline" href="{{ url_for('admin.products') }}">목록으로</a>
  </div>

  <form class="admin-form" method="post" enctype="multipart/form-data">
    <label for="name">상품명</label>
    <input id="name" name="name" value="{{ product.name if product }}" required>

    <div class="form-row">
      <div>
        <label for="category_id">카테고리</label>
        <select id="category_id" name="category_id">
          {% for c in categories %}
            <option value="{{ c.id }}" {{ 'selected' if product and product.category_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="price">가격 (원)</label>
        <input id="price" type="number" name="price" min="0" value="{{ product.price if product else '' }}" required>
      </div>
    </div>

    <label for="stock">재고</label>
    <input id="stock" type="number" name="stock" min="0" value="{{ product.stock if product else 10 }}" required>

    <label for="description">설명</label>
    <textarea id="description" name="description">{{ product.description if product }}</textarea>

    <label for="specs">주요 사양 (한 줄에 하나, 예: 동작전압: 5V)</label>
    <textarea id="specs" name="specs">{{ (product.specs or [])|join('\n') if product }}</textarea>

    <label for="devicemart_url">디바이스마트 링크 (선택)</label>
    <input id="devicemart_url" name="devicemart_url" value="{{ product.devicemart_url or '' if product }}">

    <label for="image">상품 이미지 {{ '(바꿀 때만 선택)' if editing else '' }}</label>
    {% if product and product.image_url %}
      <img class="form-preview" src="{{ image_src(product.image_url) }}" alt="현재 이미지">
    {% endif %}
    <input id="image" type="file" name="image" accept="image/*">

    <button class="btn btn-block" type="submit">{{ '수정 저장' if editing else '등록하기' }}</button>
  </form>
</section>
{% endblock %}
