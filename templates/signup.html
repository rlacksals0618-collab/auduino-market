{% extends "base.html" %}
{% block title %}회원가입{% endblock %}

{% block content %}
<div class="container">
  <form class="form-card" method="post">
    <h1>회원가입</h1>
    <label for="name">이름</label>
    <input id="name" name="name" value="{{ request.form.name }}" required autofocus>
    <label for="email">이메일</label>
    <input id="email" type="email" name="email" value="{{ request.form.email }}" required>
    <label for="password">비밀번호 (6자 이상)</label>
    <input id="password" type="password" name="password" minlength="6" required>
    <button class="btn btn-block" type="submit">가입하기</button>
    <p class="switch">이미 회원이신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
  </form>
</div>
{% endblock %}
